# --------------------------------------------------------------------------------------------- power circuits (checked)
# i_* in A at the conductor; v_min used for 48 V input currents. method: B2 (bundled / duct), E (single layer, free air).
# k_group: 1.0 single circuit, 0.8 bundle of 2-3. prot In = 0 -> source-limited circuit (check Iz >= source_max).
# dev_max_A: highest overcurrent device the downstream equipment / connector allows (connector pin rating, device spec).
# Rev B: no torsion section (twisterband removed) -> no 0.7 grouping, plain H07Z-K instead of igus CFROBOT.
circuits:
  - {id: C01, ins: 90, cable: H01, from: "B01F:+/-", to: "F0 line / E19", bus: B48, i_cont: 25.0, i_peak: 90.0, t_peak: 3, prot: {ref: "B01F internal fuse", type: "pack internal", In: 0, Vdc: 0, Icu_kA: 0},
     mm2: 25, method: E, k_group: 1.0, length_m: 1.01, source_max_A: 90, dev_max_A: 125, note: "each pack cable is protected by the OTHER pack's internal fuse (58 V 60 A, SOURCED) for a cable fault; source_max = pack 90 A RMS 10 s peak; H01 = H02 length and gauge (V:D2): CAD routes must be equalised"}

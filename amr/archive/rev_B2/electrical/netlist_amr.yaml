# Giorgio own AMR: electrical + safety netlist (rev B2, 2026-10-05)
# Rev B2 = rev B1 + the design changes of ../VERIFICATION.md (93 checked items, official sources in ../../docs/fonti/):
#   relay interface (2x PNOZ m EF 4DI4DOR) for SWD STO/INSafe and scanner control inputs + bleed resistors; SS1-t STO delay 1.2 s;
#   K0 chain fail-safe (LYNK II NO 'energised = OK', K0V 48 V low-voltage cut-off, freewheel diode); DDR remote from K0 NC aux;
#   dock: NPB-750-48 (Class B) + 59 V OV relay; RoboPad RPCOL90-100 60 A, handshake over Wi-Fi/Ethernet; PSEN on separate inputs;
#   Siemens 3SU1 E-stops; K4 via interposing relay KI4; order-code and rating corrections. The EF 8DI4DO (SX1) of rev B1 is no
#   longer needed in OA (its I/O moved to B0 + the relay modules).
# Single source of truth for check_amr.py (writes CHECKS_AMR.md) and make_diagrams.py.
# Rev B (owner decision 2026-10-05): NO waist yaw joint. Removed: Synapticon ACTILINK-JP25, THK RU124, twisterband,
# DFS60S waist encoder, FX3-MOC1, waist limit switches and every waist safety function. Jetson + arm DC-DCs move from
# the rotating plate into the CENTRE BAY of the base (CAD P10/P11/E50/E51/E52); cables to the superstructure pass the
# deck grommet E53 at (62, 0). Safety controller re-optimised: Pilz PNOZmulti 2 (PNOZ m B0 + 1x EF 8DI4DO + ES ETH).
# Tags: SOURCED = manufacturer document (URL in `sources`), SECONDARY = distributor listing / project context file,
#       ASSUMED = engineering assumption or recalled value, to verify before release. Prices EUR excl. VAT.
#       eibabo.de prices are shown incl. 19 % VAT on the site and converted here to net (/1.19).
# Coordinates/lengths: from ../out/parts.json bbox centres, Manhattan distance x 1.2 + 0.15 m terminations (ESTIMATE).
# Only certified off-the-shelf modules; no custom PCB. Do not edit ../amr_cad.py / ../amr_params.py from here:
# CAD changes are listed in ELECTRICAL.md section 13.


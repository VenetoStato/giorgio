# --------------------------------------------------------------------------------------------- DC-DC load tables
dcdc:
  - id: T24
    units: [U1, U2]
    rating_A: 20.0
    peak_A: 30.0
    peak_s: 5
    n: 2
    share_factor: 0.9          # SOURCED ddr480 current-sharing rule
    derate: 1.0                # vertical on the spine, bay <= 50 C with fans (ddr480 curve 100 % to ~60 C)
    v_out: 24.0
    eff: 0.92
    loads:
      - {name: "SWD L (200 W S1 + electronics)", cont_A: 9.0, peak_A: 15.0, basis: "200 W / 24 V = 8.3 A + 0.7 A logic; peak 13/7.9 Nm ratio [ASSUMED]"}
      - {name: "SWD R", cont_A: 9.0, peak_A: 15.0, basis: same}
      - {name: "DSR 50/5 x2 standby", cont_A: 0.1, peak_A: 0.1, basis: ASSUMED}
  - id: S24
    units: [U4]
    rating_A: 10.0
    peak_A: 10.0
    peak_s: 0
    n: 1
    share_factor: 1.0
    derate: 1.0
    v_out: 24.0
    eff: 0.91
    loads:
      - {name: "PNOZ m B0 + 2x EF 4DI4DOR + ES ETH (logic + relay coils)", cont_A: 0.6, peak_A: 0.7, basis: "~14 W [ESTIMATE; B0 external supply must provide up to 1.6 A incl. outputs, SOURCED pilz_b0]"}
      - {name: "relay contacts to SWD STO/INSafe + scanner CI incl. 7 bleed resistors 2.2 k", cont_A: 0.1, peak_A: 0.1, basis: "7 x 10.9 mA = 76 mA + inputs [ESTIMATE]"}
      - {name: "nanoScan3 x2 at max output load (15.9 W each)", cont_A: 1.33, peak_A: 2.6, basis: "SOURCED ns3_oi p.130: 15.9 W max output load, start-up <= 1.3 A each"}
      - {name: "K0 SW80B coil + K0P + K0T + K0V", cont_A: 0.7, peak_A: 1.1, basis: "SW80 continuous coil 7-13 W SOURCED + 22.32 2.2 W SOURCED + timer/monitor 2 W [ESTIMATE]"}
      - {name: "K1+K2 3RT2026 DC coils", cont_A: 0.5, peak_A: 0.5, basis: "2x 5.9 W [SOURCED siemens_docs]"}
      - {name: "Ethernet switch, PCAN gateway, LYNK gateway", cont_A: 0.4, peak_A: 0.5, basis: ASSUMED}
      - {name: "RoboPad Hall, PSEN cs3.1 x2, KS relay", cont_A: 0.15, peak_A: 0.15, basis: ASSUMED}
      - {name: "KI4 + K4 coil (92 mA SOURCED), signal tower, fans x5", cont_A: 0.7, peak_A: 0.8, basis: ASSUMED}
  - id: A24L
    variant: OA
    units: [UAL]
    rating_A: 20.0
    peak_A: 30.0
    peak_s: 5
    n: 1
    share_factor: 1.0
    derate: 1.0                # lying mount on P10: ASK Mean Well (derating for horizontal mounting)
    v_out: 24.0
    eff: 0.92
    loads:
      - {name: "OpenArm L (8 Damiao + gripper)", cont_A: 15.0, peak_A: 30.0, basis: "360 W cont / 720 W 5 s (old_arch; Damiao current limits MUST cap 720 W)"}
  - id: A24R
    variant: OA
    units: [UAR]
    rating_A: 20.0
    peak_A: 30.0
    peak_s: 5
    n: 1
    share_factor: 1.0
    derate: 1.0
    v_out: 24.0
    eff: 0.92
    loads:
      - {name: "OpenArm R", cont_A: 15.0, peak_A: 30.0, basis: same}
  - id: C12
    units: [U5]
    rating_A: 10.0
    peak_A: 15.0
    peak_s: 3
    n: 1
    share_factor: 1.0
    derate: 1.0
    v_out: 12.0
    eff: 0.895
    loads:

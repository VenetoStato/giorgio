      - {name: "2x UVC fisheye + USB hub", cont_A: 0.7, peak_A: 1.0, basis: "old_arch ASSUMED"}
  - id: COF24
    units: [U7]
    rating_A: 20.0
    peak_A: 30.0
    peak_s: 5
    n: 1
    share_factor: 1.0
    derate: 1.0
    v_out: 24.0
    eff: 0.92
    loads:
      - {name: "24 V capsule machine", cont_A: 12.5, peak_A: 13.8, basis: "300 W / 12.5 A (old_arch SOURCED truck_24v_capsule)"}
      - {name: "shuttle MCU + Actuonix", cont_A: 0.25, peak_A: 0.5, basis: ASSUMED}

# --------------------------------------------------------------------------------------------- safety controller (chosen: Pilz PNOZmulti 2)
# Module capacities: in = safe inputs, out = safe SC outputs, rly = safe relay outputs, std = standard (auxiliary, non-safe)
# outputs left after the 2 test pulses. Rev B2 station (right upper rail, x from rear): SC1 ES ETH | SC0 B0 | SR1 | SR2 | (SX2, C48).
safety_controller:
  chosen: P5
  sts_s: 1.2                 # SS1-t: PNOZ STO delay after a stop request (traction). Chosen option, see SAFETY_FUNCTIONS.md 'SS1-t timing'
  t_sls_s: 1.0               # SWD SLS[1] 'time to velocity monitoring' 6691h (configurable U16 ms, SOURCED swd_sls p.109-110)
  t_arm_sts_s: 0.5           # K1/K2 (arms) SS1-t delay, unchanged
  t_logic_s: 0.054           # PNOZ worst-case reaction through the EF 4DI4DOR relays (SOURCED pilz_cat p.26-28, V:P8)
  t_drive_s: 0.040           # SWD reaction to the start of the ramp: not published (V:E9) -> 2 x the rev B1 20 ms; measure (TP-01)
  ramp_mps2: 1.5             # non-safe quick-stop ramp in the SWD (604Ah), V:E4
  v_max_mps: 1.1             # rev B4: SMS = top speed 1.1 m/s (castor rating speed 4 km/h, G-04); bands 0.3 / 0.7 / 1.1 (CALC s.7)
  bands_mps: [0.3, 0.7, 1.1]
  aux_out_max_mA: 75         # B0 configurable outputs used as auxiliary outputs (SOURCED pilz_b0 p.8, V:P7)
  sc_out_max_A: 2.0
  relay_min_mA: 10.0         # EF 4DI4DOR DC1 minimum (SOURCED pilz_cat)
  bleed_ohm: 2200
  s24_V: 24.0
  max_modules_right: 6       # B0 (SOURCED pilz_cat p.20)
  modules:
    SC0: {mpn: "PNOZ m B0", in: 20, out: 4, rly: 0, std: 2, test: 2, width: 45.0}
    SR1: {mpn: "PNOZ m EF 4DI4DOR (traction relays)", in: 4, out: 0, rly: 4, std: 0, test: 0, width: 22.5}
    SR2: {mpn: "PNOZ m EF 4DI4DOR (scanner field-select relays)", in: 4, out: 0, rly: 4, std: 0, test: 0, width: 22.5}
    SR3: {mpn: "PNOZ m EF 4DI4DOR (SLS[2] relays, rev B4)", in: 4, out: 0, rly: 4, std: 0, test: 0, width: 22.5}
    SX2: {mpn: "PNOZ m EF 8DI4DO (C48)", in: 8, out: 4, rly: 0, std: 0, test: 0, width: 22.5, variant: C48}
  coil_loads_mA:             # loads on the B0 auxiliary outputs (<= 75 mA each)
    KI4: 9                   # Phoenix PLC-RSC-24DC/21 'Typical input current at UN 9 mA' [SOURCED phoenix_plc_rsc]
    KS: 10.4                 # Finder 38.51.7.024.0050 coil 10.4 mA / 0.3 W [SOURCED finder38 S38EN p.5]
    K4_direct: 92            # Finder 22.32 2.2 W (SOURCED) - shown to justify KI4
  rules:
    - "PNOZ m B0 test pulses T0/T1 (configurable outputs) pulse the NC contact pairs of ES1-ES2, ES3 and SE1 (cross-fault detection)"
    - "K1+K2 coils share ONE safe SC output (SC0 O0): PL e if the feedback loop (SC0 I17) is connected and cross-shorts / external sources are excluded -> K1 and K2 coil wires in SEPARATE multicore cables [SOURCED pilz_b0 p.29, V:P4]"
    - "No PNOZ semiconductor output drives an SWD input or a scanner control input: those come from the positive-guided relay contacts of SR1/SR2 (no test pulses), each with a 2.2 kOhm bleed resistor (>= 10 mA) [V:E6, V:S4, V:P14]"
    - "SR2 contacts are single-channel (PL c Cat 1 each, PFH 3.75E-8): the scanner 1-of-3 evaluation turns any single contact fault (welded or open) into an invalid code -> OSSDs off; a wrong VALID code needs two independent faults -> SF3 argued as Cat 3 / PL d [to confirm in SISTEMA]"
    - "Jetson -> PNOZ requests (FAST request, DOCK request, arms enable, coffee enable) are non-safe Modbus TCP bits via SC1: they can only REQUEST; every permissive is ANDed with the safe inputs. SC1 ES ETH is a standard module and is never part of a safety function [V:P3]"
    - "SS1-t on every protective / emergency stop: t=0 PNOZ drops INSafe_1/2 (SLS[1] 0.3 m/s requested, SWD monitors after t_SLS = 1.0 s and goes to STO itself on violation) and reports the stop to the Jetson -> SWD quick-stop ramp 1.5 m/s2 (non-safe); t = 1.2 s PNOZ drops STO_1/STO_2 (SBC: phase-short brake). Normal stop ends <= 0.827 s from the 1.1 m/s top band (rev B4), so STO always arrives at standstill"
    - "Speed bands (rev B4): SLS[1] 0.3 m/s = INSafe_1/2 (SR1 O2/O3), SLS[2] 0.7 m/s = INSafe_3/4 (SR3 O0/O1), SMS 1.1 m/s permanent (2624h). Field set and SLS request are switched together by the PNOZ program (switching_rule)"
# Options compared for the rev B2 I/O list (check_amr.py checks the fit and ranks by price). Prices: net EUR, eibabo.de 2026-10-05.

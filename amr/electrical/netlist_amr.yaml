# SWD permanent configuration (object 2624h/2625h 'permanent activation', SOURCED swd_manual p.93; per-drive parameter sets L != R with signatures 3058h, V:E7)
swd_permanent:
  SMS: "1.1 m/s max (each drive; rev B4: castor rating speed 4 km/h, G-04)"
  SLSa: "forward <= 1.1 m/s, reverse <= 0.3 m/s; each wheel with its own sign (polarity 607Eh does not change the safety sign convention: left wheel forward = negative), guaranteed >= 100 rpm motor (0.3 m/s = ~167 rpm OK) [SOURCED, V:E7]"
  SLS1: "0.3 m/s, t_SLS (6691h) = 1000 ms, error reaction STO (6698h = 6640 0000) [SOURCED swd_sls]"
  SLS2: "0.7 m/s on INSafe_3/4 (rev B4, SR3), t_SLS 1000 ms, error reaction STO"
  INSafe_3_4: "used for SLS[2] since rev B4 (rev B3: spare / SBU candidate)"

field_sets:   # nanoScan3 static control inputs, 1-of-4 evaluation (exactly one input high), same code on both scanners (rev B4: CI4 added)
  FS1_FAST:   {code: "CI1=1 CI2=0 CI3=0 CI4=0", speed: "SLS[1] and SLS[2] off: SMS 1.1 m/s, reverse <= 0.3 m/s (permanent SLSa)", prot_field: "front 943 mm from the scanner, 457 mm beyond each side (CALC s.7, incl. Z_F 150 mm), resolution 70 mm", condition: "AUTO + carry mode (SF8)"}
  FS2_SLOW:   {code: "CI1=0 CI2=1 CI3=0 CI4=0", speed: "SLS[1] 0.3 m/s per wheel", prot_field: "OSSD1 front 401 mm, sides 357 mm, rotation circle R 912 mm (CALC s.7, incl. Z_F); OSSD2 arm field circle R 2472 mm (S = K*T + T_Z + C_RO), resolution 50 mm (used only while K1/K2 closed)", condition: "default; rotation in place, MANUAL and arm work (traction STO) only here"}
  FS3_DOCK:   {code: "CI1=0 CI2=0 CI3=1 CI4=0", speed: "SLS[1] 0.3 m/s (nav creeps 0.1 m/s)", prot_field: "as FS2 OSSD1 but rear cut-out = dock contour (static, 120 mm deep); arms off", condition: "Jetson request + SLS confirmed + X1 Hall/AprilTag (non-safe request; restriction is safe)"}
  FS4_MEDIUM: {code: "CI1=0 CI2=0 CI3=0 CI4=1", speed: "SLS[2] 0.7 m/s per wheel (INSafe_3/4 via SR3)", prot_field: "front 613 mm from the scanner, 407 mm beyond each side (CALC s.7, incl. Z_F), resolution 70 mm", condition: "AUTO, corridors / mixed traffic (rev B4)"}
  switching_rule: "to a SMALLER field: drop INSafe_1/2 (SLS[1]) or INSafe_3/4 (SLS[2]) first, wait t_SLS + 0.1 s = 1.1 s, then switch CI; to a LARGER field: switch CI first, then release SLS. Scanner input delay class 'relays' (30 ms) because CI comes from SR2 contacts; tCSR = input delay + 12 ms. Field select and SLS are separate outputs on purpose. Invalid code (0 or >1 inputs high) -> scanner OSSDs off."
# --------------------------------------------------------------------------------------------- PFHd chains for the PL estimate
# PFHd per subsystem [1/h]. Sources: nanoScan3 8.0e-8 SOURCED; others ASSUMED (Annex K style, Cat 3, MTTFd high, DC medium/high).
pfhd:
  ESTOP_SERIES: 5.0e-8     # ES1+ES2 2NC in series: DC reduced to low (60-90 %) per ISO/TR 24119 (rarely operated, <= 4 devices) [ASSUMED; Siemens 3SU1 B10d from the Siemens library]
  ESTOP_CAT3: 2.5e-8       # single 2NC E-stop, test pulses, DC 99 % [ASSUMED]
  NS3: 8.0e-8              # SOURCED (V:S10)
  PNOZ_B0: 5.7e-10         # CPU 4.74E-10 + 2-ch inputs 7.95E-11 + SC output 1.66E-11 [SOURCED pilz_b0, V:P1]
  PNOZ_EF: 3.34e-10        # EF 4DI4DOR CPU 2.84E-10 + 2-ch inputs 4.27E-11 + relay outputs 2-ch 7.52E-12 [SOURCED pilz_cat, V:P14]
  PNOZ_EF8: 3.47e-10       # EF 8DI4DO (C48) CPU 2.84E-10 + inputs 4.27E-11 + SC out 2.12E-11 [SOURCED, V:P2]
  RLY_1CH: 3.75e-8         # EF 4DI4DOR relay output 1-channel (scanner CI, one per field set) [SOURCED pilz_cat]
  SWD_STO: 1.42e-9         # STO1/STO2 Cat 4 PL e [SOURCED swd_sls p.89-90, V:E5]
  SWD_SLS: 2.29e-7         # SLS / SLSa / SDI pair of SafeInputs Cat 3 PL d [SOURCED]
  SWD_SBC: 2.29e-7         # SBC3 internal via STO inputs, PL d [SOURCED]
  K1K2_CAT3: 9.5e-9        # B10D = B10 1E6 / 0.73 = 1.37E6 [SOURCED Siemens 3RT2026-1BB40 data sheet p.6, CERTAINTY F7], nop 6600/y, EDM DC 99 % (PFHd value kept from the Annex K estimate; SISTEMA at release)
  PSEN2: 2.0e-9            # 2x PSEN cs3.1 on separate input pairs [ASSUMED]
  KEY_CAT1: 2.0e-7         # key selector, plausibility [ASSUMED]
  ENABLE_CAT3: 3.0e-8      # 3-position enabling switch [ASSUMED]
  SB1_CAT1: 1.0e-7         # reset NO, edge-evaluated [ASSUMED]
  STD_K4_CATB: 3.8e-6      # auxiliary output + KI4 + K4, Cat B, MTTFd >= 30 y [ASSUMED]
  DOCK_STATION: 1.0e-6     # station relay chain, single channel + current monitor [ASSUMED]
  C48_ARM: 1.0e-7          # certified arm internal stop chain (PL d) [ASSUMED]
  BMS: null                # IEC 62619: no PL/PFHd published (V:D13) -> argued by independent layers, no PL credit
  ARMFALL: null            # OpenArm cannot hold position without power


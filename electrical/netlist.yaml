     p_typ_w: 70, p_cont_w: 360, p_peak_w: 720, peak_s: 5, source: openarm_v1_psu,
     note: "cont = OpenArm reference PSU 24 V 15 A per arm; peak = OpenArm heavy-payload advice (2 PSUs per arm, J1-J2 + J3-J8). p_typ from copper-loss model (assumed)."}
  - {id: ARM_R, desc: "OpenArm 2.0 right (same as left)", bus: A24R, p_typ_w: 70, p_cont_w: 360, p_peak_w: 720, peak_s: 5, source: openarm_v1_psu}
  - {id: SCAN_F, desc: "SICK nanoScan3 front (3.9 W typ + OSSD load)", bus: S24, p_typ_w: 3.9, p_cont_w: 6, p_peak_w: 8, peak_s: 1, source: sick_nanoscan3}
  - {id: SCAN_R, desc: "SICK nanoScan3 rear", bus: S24, p_typ_w: 3.9, p_cont_w: 6, p_peak_w: 8, peak_s: 1, source: sick_nanoscan3}
  - {id: PNOZ_L, desc: "Pilz PNOZ m B0 + PNOZ m EF 4DI4DOR", bus: S24, p_typ_w: 5, p_cont_w: 7, p_peak_w: 9, peak_s: 1, assumed: true}
  - {id: KCOIL, desc: "K1 + K2 contactor coils (3RT2036 DC coil) + K3 precharge relay", bus: S24, p_typ_w: 27, p_cont_w: 27, p_peak_w: 30, peak_s: 1, assumed: true,
     note: "13 W per S2 DC coil assumed; electronic-coil variant would cut this to a few W"}
  - {id: DCDC_FAN, desc: "2x 60 mm 24 V fans over the lying DDR-480C pair (forced air restores the vertical-mount rating)", bus: S24, p_typ_w: 2.4, p_cont_w: 2.4, p_peak_w: 3, peak_s: 1, assumed: true}
  - {id: ETH_SWITCH, desc: "Industrial Ethernet switch 5-8 port 24 V DIN (scanners, PNOZ ES ETH, Jetson, base)", bus: S24, p_typ_w: 3, p_cont_w: 4, p_peak_w: 5, peak_s: 1, assumed: true}
  - {id: BEACON, desc: "Status light / buzzer, dock IR/Wi-Fi handshake MCU", bus: S24, p_typ_w: 2, p_cont_w: 4, p_peak_w: 5, peak_s: 1, assumed: true}
  - {id: JETSON, desc: "Jetson AGX Orin 64 GB module + carrier (7-20 V input, 15-60 W modes)", bus: C12, p_typ_w: 35, p_cont_w: 75, p_peak_w: 100, peak_s: 3, source: jetson_agx_orin_ds,
     note: "60 W MAXN module + carrier/NVMe/Wi-Fi; carrier peak assumed"}
  - {id: GEMINI, desc: "Orbbec Gemini 336L via USB (<3 W avg, <6 W peak)", bus: C12, p_typ_w: 3, p_cont_w: 3, p_peak_w: 6, peak_s: 1, source: orbbec_336l}
  - {id: FISHEYE, desc: "2x USB UVC fisheye cameras (front/back; replace Insta360 X4 per FEASIBILITY.md) + powered USB 3 hub", bus: C12, p_typ_w: 5, p_cont_w: 8, p_peak_w: 12, peak_s: 3, assumed: true,
     note: "~1.5 W per UVC camera + hub overhead"}
  - {id: LEDFACE, desc: "32x16 P4 HUB75 LED face", bus: L5, p_typ_w: 3, p_cont_w: 10, p_peak_w: 10, peak_s: 1, source: waveshare_p4, assumed: true,
     note: "scaled from 64x32 P4 (5 V 4 A max): 1/4 pixels -> 2 A budget"}
  - {id: EYES, desc: "2x GC9A01 round displays + ESP32", bus: L5, p_typ_w: 1.5, p_cont_w: 2, p_peak_w: 3, peak_s: 1, assumed: true}
  - {id: LEDSTRIP, desc: "Mustache / base status LED strips", bus: L5, p_typ_w: 2, p_cont_w: 6, p_peak_w: 6, peak_s: 1, assumed: true}
  - {id: TRACER_CHG_IN, desc: "Tracer battery charger input (Orion-Tr 48/24-16 set to 10 A)", bus: B48, p_typ_w: 0, p_cont_w: 330, p_peak_w: 330, peak_s: 3600,
     assumed: true, note: "284 W out (28.4 V x 10 A) / 0.87. Energy balancing is handled by the autonomy model, not by p_typ."}
  - {id: COFFEE, desc: "24 V DC capsule machine (truck type, 300 W heater + pump), barista configuration", bus: COF24, p_typ_w: 0, p_cont_w: 300, p_peak_w: 330, peak_s: 5,
     source: truck_24v_capsule, note: "p_typ 0: brewing energy is set per profile (cups/h x Wh/cup)"}
  - {id: COFFEE_IO, desc: "Coffee shuttle MCU (RP2040), Actuonix P16-150 12 V via buck, cup sensor", bus: COF24, p_typ_w: 1, p_cont_w: 6, p_peak_w: 12, peak_s: 3, assumed: true}
  - {id: TRACER_DRIVE, desc: "Tracer 2.0 traction (2x 400 W BLDC), own battery", bus: T24, p_typ_w: 60, p_cont_w: 400, p_peak_w: 800, peak_s: 3, source: tracer_manual,
     note: "40-80 W typical on flat floor (docs/alimentazione); peak = 2x motor rating"}
  - {id: TRACER_ELEC, desc: "Tracer controller, lights", bus: T24, p_typ_w: 15, p_cont_w: 15, p_peak_w: 20, peak_s: 1, assumed: true}

# ------------------------------------------------------------------------------------------- converters
converters:
  - {id: DCDC_ARM_L, component: DCDC_ARM, out_bus: A24L, iout_a: 20, peak_factor: 1.5, peak_s: 5, eta: 0.92, vin_min: 33.6, vin_max: 67.2,
     mount: lying, ambient_c: 50, derate_lying: 0.75, fan: true,
     peak_note: "150 % for 5 s, then constant current 105-135 % (auto-recovery) - no shutdown"}
  - {id: DCDC_ARM_R, component: DCDC_ARM, out_bus: A24R, iout_a: 20, peak_factor: 1.5, peak_s: 5, eta: 0.92, vin_min: 33.6, vin_max: 67.2,
     mount: lying, ambient_c: 50, derate_lying: 0.75, fan: true,
     peak_note: "150 % for 5 s"}
  - {id: DCDC_S24, component: DCDC_S24, out_bus: S24, iout_a: 5, peak_factor: 1.5, peak_s: 3, eta: 0.91, vin_min: 33.6, vin_max: 67.2}
  - {id: DCDC_CPU, component: DCDC_CPU, out_bus: C12, iout_a: 10, peak_factor: 1.5, peak_s: 3, eta: 0.895, vin_min: 33.6, vin_max: 67.2}
  - {id: DCDC_COF, component: DCDC_COF, out_bus: COF24, iout_a: 20, peak_factor: 1.5, peak_s: 5, eta: 0.92, vin_min: 33.6, vin_max: 67.2}
  - {id: DCDC_5V, component: DCDC_5V, out_bus: L5, iout_a: 12, peak_factor: 1.0, peak_s: 0, eta: 0.875, vin_min: 18, vin_max: 75}

# ------------------------------------------------------------------------------------------- wiring rules
wiring:
  # IEC 60204-1:2016 Table 6 style base ampacity, copper, PVC 70 C, 40 C ambient, installation method B1
  # (conductors in conduit/duct - the conservative case for a robot harness). Values as recalled -> verify. (assumed)
  ampacity_table:
    B1: {0.75: 7.6, 1.0: 10.4, 1.5: 13.5, 2.5: 18.3, 4.0: 25, 6.0: 32, 10.0: 44, 16.0: 60, 25.0: 77, 35.0: 97}
  ambient_correction: {30: 1.15, 35: 1.08, 40: 1.00, 45: 0.91, 50: 0.82, 55: 0.71, 60: 0.58}   # PVC 70 C
  grouping_correction: {1: 1.0, 2: 0.80, 3: 0.70, 4: 0.65, 6: 0.57, 9: 0.50}
  conductor: "flexible tinned Cu class 5, PVC 70 C min (prefer 90-105 C insulation e.g. H07Z-K / silicone for the base)"

# ------------------------------------------------------------------------------------------- branches
# current.from: conv_in (DC-DC input at V_min), conv_out (DC-DC output to loads), load, sum, fixed
branches:
  - {id: W01, desc: "Pack -> F0 -> Q0 (MSD) -> B48 busbar", bus: B48, current: {from: sum, branches: [W02, W05, W06, W07, W08, W14]},
     csa_mm2: 16, length_m: 0.6, method: B1, ambient_c: 40, grouped: 1, fuse: F0, vdrop_limit_pct: 3,
     upstream_r_mohm: []}
  - {id: W02, desc: "B48 -> F1 -> K1/K2 -> arm DC-DC pair", bus: B48, current: {from: conv_in, convs: [DCDC_ARM_L, DCDC_ARM_R]},
     csa_mm2: 10, length_m: 0.5, method: B1, ambient_c: 45, grouped: 1, fuse: F1, vdrop_limit_pct: 3, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W03L, desc: "K2 -> F1L -> DDR-480C-24 left input", bus: B48, current: {from: conv_in, convs: [DCDC_ARM_L]},
     csa_mm2: 6, length_m: 0.3, method: B1, ambient_c: 45, grouped: 2, fuse: F1L, vdrop_limit_pct: 3, upstream_r_mohm: [0.3, 0.2, 0.75, 0.6, 0.4]}
  - {id: W03R, desc: "K2 -> F1R -> DDR-480C-24 right input", bus: B48, current: {from: conv_in, convs: [DCDC_ARM_R]},
     csa_mm2: 6, length_m: 0.3, method: B1, ambient_c: 45, grouped: 2, fuse: F1R, vdrop_limit_pct: 3, upstream_r_mohm: [0.3, 0.2, 0.75, 0.6, 0.4]}
  - {id: W04L, desc: "DDR-480C left -> ORing -> F10 -> left arm hub (through column)", bus: A24L, current: {from: conv_out, conv: DCDC_ARM_L},
     csa_mm2: 6, length_m: 1.8, method: B1, ambient_c: 40, grouped: 1, fuse: F10, vdrop_limit_pct: 3, isc_override_a: 40}
  - {id: W04R, desc: "DDR-480C right -> ORing -> F11 -> right arm hub (through column)", bus: A24R, current: {from: conv_out, conv: DCDC_ARM_R},
     csa_mm2: 6, length_m: 1.8, method: B1, ambient_c: 40, grouped: 1, fuse: F11, vdrop_limit_pct: 3, isc_override_a: 40}
  - {id: W05, desc: "B48 -> F2 -> DDR-120C-24 (safety 24 V)", bus: B48, current: {from: conv_in, convs: [DCDC_S24]},
     csa_mm2: 1.5, length_m: 0.4, method: B1, ambient_c: 45, grouped: 4, fuse: F2, vdrop_limit_pct: 5, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W06, desc: "B48 -> F3 -> DDR-120C-12 (compute)", bus: B48, current: {from: conv_in, convs: [DCDC_CPU]},
     csa_mm2: 1.5, length_m: 0.4, method: B1, ambient_c: 45, grouped: 4, fuse: F3, vdrop_limit_pct: 5, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W07, desc: "B48 -> F4 -> DDR-60L-5 (UI)", bus: B48, current: {from: conv_in, convs: [DCDC_5V]},
     csa_mm2: 1.5, length_m: 0.4, method: B1, ambient_c: 45, grouped: 4, fuse: F4, vdrop_limit_pct: 5, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W08, desc: "B48 -> F5 -> Orion-Tr 48/24-16 (Tracer charger)", bus: B48, current: {from: load, load: TRACER_CHG_IN},
     csa_mm2: 4, length_m: 0.5, method: B1, ambient_c: 45, grouped: 4, fuse: F5, vdrop_limit_pct: 3, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W09, desc: "Orion-Tr out -> F7 -> Tracer external 2-pin charging port (no vehicle modification)", bus: T24, current: {from: fixed, i_cont_a: 10, i_peak_a: 10, peak_s: 3600},
     csa_mm2: 2.5, length_m: 0.8, method: B1, ambient_c: 45, grouped: 1, fuse: F7, vdrop_limit_pct: 3, isc_override_a: 3000,
     note: "Tracer battery prospective Isc unknown; 3 kA assumed"}
  - {id: W10, desc: "S24 -> F20 -> front scanner + PNOZ + coils (distribution)", bus: S24, current: {from: conv_out, conv: DCDC_S24},
     csa_mm2: 1.0, length_m: 1.0, method: B1, ambient_c: 45, grouped: 4, fuse: F20, vdrop_limit_pct: 5, isc_override_a: 8}
  - {id: W11, desc: "C12 -> F30 -> Jetson AGX Orin", bus: C12, current: {from: conv_out, conv: DCDC_CPU},
     csa_mm2: 2.5, length_m: 0.6, method: B1, ambient_c: 50, grouped: 2, fuse: F30, vdrop_limit_pct: 5, isc_override_a: 15}
  - {id: W12, desc: "L5 -> F40 -> head (LED face, eyes, ESP32) up the column", bus: L5, current: {from: conv_out, conv: DCDC_5V},
     csa_mm2: 1.5, length_m: 1.4, method: B1, ambient_c: 40, grouped: 2, fuse: F40, vdrop_limit_pct: 5, isc_override_a: 13}
  - {id: W14, desc: "B48 -> F6 -> DDR-480C-24 (coffee module, cut by PNOZ)", bus: B48, current: {from: conv_in, convs: [DCDC_COF]},
     csa_mm2: 4, length_m: 0.6, method: B1, ambient_c: 45, grouped: 4, fuse: F6, vdrop_limit_pct: 3, upstream_r_mohm: [0.3, 0.2, 0.75]}
  - {id: W15, desc: "COF24 -> K4 -> F60 -> coffee machine (backpack)", bus: COF24, current: {from: conv_out, conv: DCDC_COF},
     csa_mm2: 4, length_m: 1.0, method: B1, ambient_c: 40, grouped: 1, fuse: F60, vdrop_limit_pct: 3, isc_override_a: 27}
  - {id: W13, desc: "Dock contacts -> ideal diode -> F9 (at pack) -> BMS charge input", bus: B48, current: {from: fixed, i_cont_a: 21, i_peak_a: 21, peak_s: 7200},
     csa_mm2: 10, length_m: 0.7, method: B1, ambient_c: 45, grouped: 1, fuse: F9, vdrop_limit_pct: 3, upstream_r_mohm: [0.3]}

fuses:
  - {id: F0, component: FUSE_JLLN060}
  - {id: F1, component: FUSE_JLLN035}
  - {id: F1L, component: FUSE_SPF020}
  - {id: F1R, component: FUSE_SPF020}
  - {id: F2, component: FUSE_SPF006}
  - {id: F3, component: FUSE_SPF006}
  - {id: F4, component: FUSE_SPF003}
  - {id: F5, component: FUSE_SPF012}
  - {id: F6, component: FUSE_SPF012}
  - {id: F60, component: FUSE_ATO20}
  - {id: F7, component: FUSE_SPF015}
  - {id: F9, component: FUSE_SPF030}
  - {id: F10, component: FUSE_ATO25}
  - {id: F11, component: FUSE_ATO25}
  - {id: F20, component: FUSE_ATO5}
  - {id: F30, component: FUSE_ATO10}
  - {id: F40, component: FUSE_ATO5}

contactors:
  - {id: K1, component: K_ARM, i_cont_a: 22.0, i_break_a: 45.0, v_dc: 54.75,
     note: "worst-case break = both arm DC-DCs at 150 % peak at V_min (SS1 failed). Normal break after SS1 < 3 A."}
  - {id: K2, component: K_ARM, i_cont_a: 22.0, i_break_a: 45.0, v_dc: 54.75}

precharge:
  - {id: PC_ARM, resistor: R_PRE, c_total_uf: 3000, c_note: "2x DDR-480C input caps (unknown, 2x470 uF assumed) + 2x1000 uF added input bulk",
     done_fraction: 0.95, t_max_s: 1.0, r_contactor_path_ohm: 0.02, repeat_per_min: 2, dcdc_inhibit: true}

regen:
  v_dcdc_set: 24.0
  v_dcdc_ovp_min: 28.8          # DDR-480C-24 OVP 28.8-35 V (datasheet)
  v_motor_ovp: 32.0             # DM-J4310 / DM-J4340P 24 V version, recommended OVP (datasheet)
  v_clamp_on: 27.5
  c_bus_uf_per_arm: 2500        # assumed: DC-DC output caps + 8 Damiao drivers
  e_regen_j_per_arm: 50         # assumed: controlled stop from max speed with 4 kg payload, lowering 0.3 m
  p_regen_peak_w_per_arm: 250   # assumed
  stops_per_min: 6
  clamp_component: CLAMP
  oring: "Mean Well DRDN40-24 ideal-diode redundancy module per arm keeps regen off the DC-DC output (no OVP trip)"

# ------------------------------------------------------------------------------------------- energy management
# Mutually exclusive B48 consumers (Jetson power manager, non-safety): only the larger of each group counts
# in pack-level sustained/peak sums and in the main feeder W01. Tracer charging is paused while brewing.
exclusive:
  - {loads: [TRACER_CHG_IN], convs: [DCDC_COF], note: "Orion-Tr remote-off while the coffee heater runs"}

# ------------------------------------------------------------------------------------------- duty profiles
# p_avg: average W per load over the profile; loads not listed use p_typ_w
profiles:
  - id: P1
    desc: "Logistics kitting, continuous (arms active 100 %, driving 30 %)"
    target_h: 4
    p_avg: {ARM_L: 70, ARM_R: 70, JETSON: 45, TRACER_DRIVE: 18, TRACER_CHG_IN: 0}
  - id: P2
    desc: "Barista service: 8 cups/h brewed on board (8 x 15 Wh = 120 W avg), arms active 25 %, driving 20 %"
    target_h: 6
    p_avg: {ARM_L: 30, ARM_R: 30, JETSON: 35, TRACER_DRIVE: 12, TRACER_CHG_IN: 0, COFFEE: 120, COFFEE_IO: 2}
  - id: P3
    desc: "Reception / standby, arms parked and powered, no driving, face on"
    target_h: 8
    p_avg: {ARM_L: 10, ARM_R: 10, JETSON: 25, TRACER_DRIVE: 0, TRACER_CHG_IN: 0, FISHEYE: 5}

# ------------------------------------------------------------------------------------------- charging
charging:
  cv_v: 54.0                     # 3.60 V/cell
  dock_charger_component: CHG_DOCK
  dock_contact_component: DOCK_CONTACTS
  hotel_load_w: 120              # robot awake on the dock (Jetson idle, scanners, PNOZ, coils)
  tracer_charge_w: 284           # 28.4 V x 10 A
  tracer_priority_soc: 0.80      # Tracer charged on the dock only once the pack is above 80 % (or when Tracer < 30 %)
  cv_start_soc: 0.95
  cv_tail_h: 0.3
  target_20_80_min: 90
  target_full_h: 4.0

# ------------------------------------------------------------------------------------------- coffee options
coffee:
  cups_per_hour_service: 8
  options:
    - id: A
      desc: "230 V commercial capsule machine on board via 48 V inverter"
      machine_w: 1310            # Essenza Mini EU 1200-1310 W
      eta_conv: 0.93             # Phoenix Inverter Smart 48/2000 (94 % max)
      idle_w: 2.1                # inverter ECO mode (11 W without)
      wh_per_cup: 15             # assumed 10-15 Wh incl. heat-up (machine side)
      brew_min: 1.0
      source: [nespresso_essenza_mini, victron_inverter_smart]
    - id: B
      desc: "24 V DC capsule machine on board (truck type, 300 W) via DDR-480C-24"
      machine_w: 300
      eta_conv: 0.92
      idle_w: 1.0
      wh_per_cup: 15             # assumed: same water heating, longer heat-up losses
      brew_min: 3.0
      source: [truck_24v_capsule, handpresso_auto]
    - id: C
      desc: "230 V commercial capsule machine fixed at the docking station (robot carries the cup)"
      machine_w: 0
      eta_conv: 1.0
      idle_w: 0
      wh_per_cup: 0
      brew_min: 1.0
      source: [nespresso_essenza_mini]
  default: B

# ------------------------------------------------------------------------------------------- safety functions
safety:
  pl_target: d
  functions:
    - id: SF1
      desc: "E-stop -> SS1-t -> arm power removed by K1+K2"
      plr: d
      cat: 3
      chain:
        - {name: "E-stop 2NC (B10D 100k, nop 500/y, DC high via cross-monitoring)", pfhd: 1.0e-7, assumed: true}
        - {name: "PNOZ m B0", pfhd: 3.0e-9, assumed: true}
        - {name: "K1+K2 3RT2 mirror contacts + EDM (B10D 1.3M)", pfhd: 1.0e-7, assumed: true}
    - id: SF2
      desc: "Protective field violated -> SS1-t -> arm power removed"
      plr: d
      cat: 3
      chain:
        - {name: "nanoScan3 (datasheet PFHd)", pfhd: 8.0e-8, source: sick_nanoscan3}
        - {name: "PNOZ m B0", pfhd: 3.0e-9, assumed: true}
        - {name: "K1+K2 + EDM", pfhd: 1.0e-7, assumed: true}
    - id: SF3
      desc: "Protective field / E-stop -> base stop (Tracer)"
      plr: d
      cat: 3
      chain:
        - {name: "nanoScan3", pfhd: 8.0e-8, source: sick_nanoscan3}
        - {name: "PNOZ m B0 + EF 4DI4DOR relay output", pfhd: 1.3e-8, assumed: true}
        - {name: "Tracer 2.0: CAN zero-speed + 500 ms timeout only (no external safety input, manual V1.0.0 p.11; internal modification forbidden)", pfhd: null}


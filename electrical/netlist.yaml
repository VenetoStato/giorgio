ride_through_v: 28.8          # DDR-480C 100 ms input ride-through limit

# ------------------------------------------------------------------------------------------- battery
battery:
  chemistry: LiFePO4
  series: 15                 # 15s keeps V_max 54.75 V < 60 V; 15s 30 Ah = 1.44 kWh (CAD final, cad/README.md)
  parallel: 5
  cell:
    ref: "LFP 32700 cylindrical 6 Ah power-type cell (EVE/Lishen class), 15s5p = 75 cells in 2 lying layers (32 mm) -> fits 270x400x75 mm, ~10.5 kg cells + BMS/case ~2.5 kg = 13 kg"
    v_nom: 3.2
    v_max: 3.65
    v_min_cutoff: 2.5
    ah: 6
    r_ac_mohm: 6.0           # assumed: lowest plausible ACIR of a 6 Ah 32700 (worst case for Isc)
    r_dc_mohm: 14.0          # assumed: DC-IR incl. ageing (worst case for sag)
    c_cont: 1.2              # REQUIREMENT on the pack spec (32700 power cells are typically rated 2-3 C continuous) [A]
    c_pulse: 2.0             # REQUIREMENT, <= 10 s
    c_charge: 1.0            # assumed max charge C-rate at 15-35 C
    assumed: true
  r_interconnect_mohm: 3.0   # assumed: nickel/copper strip interconnects of a cylindrical pack
  r_bms_path_mohm: 1.0       # assumed: MOSFET BMS + shunt, hot (max)
  r_bms_path_min_mohm: 0.5   # assumed: cold (min) - used for Isc
  usable_dod: 0.90
  bms_component: BMS

tracer:                      # AgileX Tracer 2.0 own battery (separate island)
  v_nom: 25.6
  ah: 30
  usable_dod: 0.85
  charger_component: CHG_TRACER
  source: tracer_manual

# ------------------------------------------------------------------------------------------- buses
buses:
  - {id: B48, desc: "48 V battery bus (15s LFP)", v_nom: 48.0, v_min: 37.5, v_max: 54.75}
  - {id: A24L, desc: "24 V left arm bus (safety-switched upstream)", v_nom: 24.0, v_min: 23.0, v_max: 27.5}
  - {id: A24R, desc: "24 V right arm bus (safety-switched upstream)", v_nom: 24.0, v_min: 23.0, v_max: 27.5}
  - {id: S24, desc: "24 V safety + sensors, always on", v_nom: 24.0, v_min: 23.5, v_max: 24.5}
  - {id: C12, desc: "12 V compute (Jetson + USB devices)", v_nom: 12.0, v_min: 11.8, v_max: 12.2}
  - {id: L5, desc: "5 V UI (LED face, eyes, ESP32)", v_nom: 5.1, v_min: 5.0, v_max: 5.2}
  - {id: T24, desc: "Tracer 24 V battery domain (galvanically isolated)", v_nom: 25.6, v_min: 22.0, v_max: 29.2}
  - {id: COF24, desc: "24 V coffee module (OPTION B only)", v_nom: 24.0, v_min: 23.5, v_max: 24.5}

# ------------------------------------------------------------------------------------------- loads
# p_typ: typical average when active (autonomy); p_cont: max sustained (sizing); p_peak: <= peak_s seconds
loads:

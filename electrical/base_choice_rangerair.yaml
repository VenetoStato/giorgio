name: "AgileX Ranger Air, superstructure powered from the base (24 V), AgileX OEM dock"
lines:
  - {item: "AgileX Ranger Air (24 V 30 Ah LFP, 80 kg payload, accessory output 24-29.6 V <= 25 A / 600 W)", unit: 0,

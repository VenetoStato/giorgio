  target_h: 6
  p_avg:
    ARM_L: 30
    ARM_R: 30
    JETSON: 35
    COFFEE: 120
    COFFEE_IO: 2
    BASE_TRACTION: 12
    BASE_TO_PACK: 0
- id: P3
  desc: Reception / standby, arms parked and powered, no driving, face on
  target_h: 8
  p_avg:
    ARM_L: 10
    ARM_R: 10
    JETSON: 25
    FISHEYE: 5
    BASE_TRACTION: 0
    BASE_TO_PACK: 0
coffee:
  cups_per_hour_service: 8
  options:
  - id: A
    desc: 230 V commercial capsule machine on board via 48 V inverter
    machine_w: 1310
    eta_conv: 0.93
    idle_w: 2.1
    wh_per_cup: 15
    brew_min: 1.0
    source:
    - nespresso_essenza_mini
    - victron_inverter_smart
  - id: B
    desc: 24 V DC capsule machine on board (truck type, 300 W) via DDR-480C-24
    machine_w: 300
    eta_conv: 0.92
    idle_w: 1.0
    wh_per_cup: 15
    brew_min: 3.0
    source:
    - truck_24v_capsule
    - handpresso_auto
  - id: C
    desc: 230 V commercial capsule machine fixed at the docking station (robot carries the cup)
    machine_w: 0
    eta_conv: 1.0
    idle_w: 0
    wh_per_cup: 0
    brew_min: 1.0
    source:
    - nespresso_essenza_mini
  default: B
safety:
  pl_target: d
  functions:
  - id: SF1
    desc: E-stop -> SS1-t -> arm power removed by K1+K2
    plr: d
    cat: 3
    chain:
    - name: E-stop 2NC (B10D 100k, nop 500/y, DC high via cross-monitoring)
      pfhd: 1.0e-07
      assumed: true
    - name: PNOZ m B0
      pfhd: 3.0e-09
      assumed: true
    - name: K1+K2 3RT2 mirror contacts + EDM (B10D 1.3M)
      pfhd: 1.0e-07
      assumed: true
  - id: SF2
    desc: Protective field violated -> SS1-t -> arm power removed
    plr: d
    cat: 3
    chain:
    - name: nanoScan3 (datasheet PFHd)
      pfhd: 8.0e-08
      source: sick_nanoscan3
    - name: PNOZ m B0
      pfhd: 3.0e-09
      assumed: true
    - name: K1+K2 + EDM
      pfhd: 1.0e-07
      assumed: true
  - id: SF3
    desc: Giorgio E-stop / protective field -> RB-THERON drive stop
    plr: d
    cat: 3
    chain:
    - name: nanoScan3
      pfhd: 8.0e-08
      source: sick_nanoscan3
    - name: PNOZ m B0 + EF 4DI4DOR relay output
      pfhd: 1.3e-08
      assumed: true
    - name: 'RB-THERON safety PLC external E-stop / safe-stop input for a third-party payload: NOT documented (safety_module exposes only E-stop status, laser modes,
        watchdog, speed word over Modbus)'
      pfhd: null

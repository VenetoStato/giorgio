exclusive: []
profiles:
- id: P1
  desc: Logistics kitting, continuous (arms active 100 %, driving 30 %)
  target_h: 4
  p_avg:
    ARM_L: 70
    ARM_R: 70
    JETSON: 45
    BASE_TRACTION: 18
    BASE_TO_PACK: 0
- id: P2
